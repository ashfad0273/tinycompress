<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob:; connect-src 'self'"
    />
    <title>TinyCompress</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" /></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="m21 16-5-5-8 8" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
        <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 8.5M4 4v4.5h4.5" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 14l6-6 4 4 6-6M4 20h16" /></symbol>
      </defs>
    </svg>

    <div class="app">
      <aside class="side">
        <header class="brand">
          <span class="logo" aria-hidden="true"><svg class="icon"><use href="#i-logo" /></svg></span>
          <div>
            <h1>TinyCompress</h1>
            <p>Bulk compression with TinyPNG</p>
          </div>
        </header>

        <section class="panel" aria-labelledby="keys-title">
          <div class="panel-head">
            <h2 id="keys-title">API keys</h2>
            <div class="panel-tools">
              <button id="toggle-keys" class="text-btn" type="button">Add key</button>
            </div>
          </div>
          <div id="keys-box" class="keys-box" hidden>
            <button id="keys-summary" class="keys-summary" type="button" aria-expanded="false" aria-controls="keys-detail">
              <span class="keys-stats" title="Compressions left assumes TinyPNG's free plan of 500 a month per key">
                <span class="keys-stat"><strong id="keys-left">0</strong><small>compressions left</small></span>
                <span class="keys-stat"><strong id="keys-used">0</strong><small>used this month</small></span>
              </span>
              <span class="meter"><span id="keys-bar"></span></span>
              <span class="keys-foot">
                <span id="keys-note"></span>
                <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
              </span>
            </button>
            <div id="keys-detail" class="keys-detail" inert>
              <div class="keys-detail-inner">
                <ul id="key-list" class="keys"></ul>
                <button id="recheck" class="text-btn" type="button">Recheck keys</button>
              </div>
            </div>
          </div>
          <form id="key-form" class="key-form">
            <label for="key-input">Paste one or more keys, one per line</label>
            <textarea id="key-input" rows="3" spellcheck="false" autocomplete="off"></textarea>
            <button class="btn primary block" type="submit">Add keys</button>
          </form>
          <p id="key-message" class="message" role="status"></p>
        </section>

        <section class="panel" aria-labelledby="formats-title">
          <div class="panel-head"><h2 id="formats-title">Output formats</h2></div>
          <div id="formats" class="formats">
            <label><input type="checkbox" value="avif" checked /><span><b>AVIF</b><small>Smallest files</small></span></label>
            <label><input type="checkbox" value="webp" /><span><b>WebP</b><small>Small, widely supported</small></span></label>
            <label><input type="checkbox" value="png" /><span><b>PNG</b><small>Keeps sharp edges</small></span></label>
            <label><input type="checkbox" value="original" /><span><b>Same as source</b><small>Only compress</small></span></label>
          </div>
          <p id="estimate" class="hint" role="status"></p>
        </section>

        <section id="save-panel" class="panel" aria-labelledby="save-title" hidden>
          <div class="panel-head"><h2 id="save-title">Save results</h2></div>
          <p id="save-status" class="save-status">Download everything as a ZIP when the batch finishes.</p>
          <button id="pick-dest" class="btn block" type="button"><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Save straight to a folder</button>
        </section>

        <p class="privacy">
          <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg>
          <span id="privacy-text"></span>
        </p>
      </aside>

      <main class="main">
        <button id="hero" class="hero" type="button">
          <span class="hero-icon" aria-hidden="true"><svg class="icon"><use href="#i-upload" /></svg></span>
          <strong>Drop images or folders anywhere</strong>
          <span>PNG, JPEG, WebP and AVIF. As many as you like. Click to choose images.</span>
        </button>
        <button id="hero-folder" class="btn hero-folder" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Choose a folder instead
        </button>

        <section id="queue" class="queue" aria-label="Image queue" hidden>
          <div class="command">
            <div class="command-row">
              <div class="summary">
                <h2 id="headline" aria-live="polite"></h2>
                <p id="subline"></p>
              </div>
              <div class="actions">
                <button id="add-files" class="btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>Images</button>
                <button id="add-folder" class="btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Folder</button>
                <button id="clear" class="btn quiet" type="button">Clear</button>
                <button id="retry" class="btn" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-retry" /></svg>Retry failed</button>
                <button id="open" class="btn" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Open folder</button>
                <button id="zip" class="btn" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>ZIP</button>
                <button id="start" class="btn primary start" type="button"><svg class="icon" aria-hidden="true"><use id="start-icon" href="#i-play" /></svg><span id="start-label">Start</span></button>
              </div>
            </div>
            <div class="progress" aria-hidden="true"><div id="progress"></div></div>
            <div class="command-foot">
              <span id="out-dir" class="out-dir"></span>
            </div>
          </div>
          <div id="banner" class="banner" role="alert" hidden></div>
          <div id="list" class="list" tabindex="0" aria-label="Images"><div id="list-spacer"></div></div>
        </section>
      </main>
    </div>

    <input id="file-input" type="file" multiple accept=".png,.jpg,.jpeg,.jfif,.webp,.avif" hidden />
    <input id="folder-input" type="file" webkitdirectory hidden />

    <div id="overlay" class="overlay" aria-hidden="true">
      <div class="overlay-card">
        <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>
        <strong>Drop to add to the queue</strong>
      </div>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <div id="download-menu" class="download-menu" popover></div>

    <dialog id="compare" class="compare">
      <header>
        <h2 id="compare-title"></h2>
        <div id="compare-formats" class="compare-formats"></div>
        <button id="compare-close" class="icon-btn" type="button" aria-label="Close comparison"><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
      </header>
      <div class="stage-view">
        <img id="compare-before" alt="Original image" />
        <img id="compare-after" alt="Compressed image" />
        <span id="compare-handle" class="handle" aria-hidden="true"></span>
        <span id="compare-left" class="tag left"></span>
        <span id="compare-right" class="tag right"></span>
        <input id="compare-range" type="range" min="0" max="100" value="50" aria-label="Comparison position" />
      </div>
    </dialog>

    <script src="core.js"></script>
    <script src="backends.js"></script>
    <script src="app.js"></script>
  </body>
</html>
